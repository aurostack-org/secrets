name: Release

# Cut a release with `npm version <patch|minor|major> && git push --follow-tags`:
# npm bumps package.json and tags vX.Y.Z; this workflow runs the full CI on that
# tag, stages the version on npm and creates the GitHub release. The version
# goes live once a maintainer approves it with 2FA (`npm stage approve <id>`,
# or npmjs.com → Staged Packages).

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# GitHub occasionally delivers one tag push twice. Queue the duplicate behind
# the first run; it then finds the version staged and the release created.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Stage on npm, release on GitHub
    needs: ci
    runs-on: ubuntu-latest
    # npm's trusted publisher only accepts this environment, which GitHub
    # restricts to v* tags.
    environment: npm
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Tag matches package.json
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json ($version)"
            exit 1
          fi

      # dist/ is not committed, so build here; the check runs on the exact
      # files that get staged.
      - run: npm ci
      - run: npm run build
      - name: npm package holds every build output and nothing private
        run: node scripts/check-package.mjs

      # Staged publishing needs npm 11.15.0+. Authentication is the trusted
      # publisher on npmjs.com (OIDC) — there is no token.
      - run: npm install -g npm@latest
      - name: Stage on npm (awaits maintainer approval)
        run: |
          set +e
          npm stage publish 2>&1 | tee stage.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] && grep -q 'E409' stage.log; then
            echo "::notice::$GITHUB_REF_NAME is already staged or published on npm; nothing to stage"
            exit 0
          fi
          exit "$status"

      - name: GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::GitHub release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}
